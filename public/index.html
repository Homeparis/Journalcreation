<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zently Journal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        header h1 span { color: #4ecdc4; }
        .subtitle { color: #888; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #333;
        }
        .stat-card .number { font-size: 2.5em; font-weight: bold; color: #4ecdc4; }
        .stat-card .label { color: #888; margin-top: 5px; }

        .progress-container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            height: 30px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .section { margin-bottom: 30px; }
        .section h2 {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .task-list { list-style: none; }
        .task-item {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .task-item:hover { background: rgba(255,255,255,0.1); }
        .task-item.completed { border-left-color: #4ecdc4; opacity: 0.7; }
        .task-item.in-progress { border-left-color: #f39c12; }
        .task-item.not-started { border-left-color: #666; }

        .task-info { flex: 1; }
        .task-title { font-weight: bold; margin-bottom: 5px; }
        .task-meta { font-size: 0.85em; color: #888; }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-badge.completed { background: #4ecdc4; color: #000; }
        .status-badge.in-progress { background: #f39c12; color: #000; }
        .status-badge.not-started { background: #666; color: #fff; }

        .session-card {
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid #4ecdc4;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .session-active { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .event-log {
            background: #111;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 300px;
            overflow-y: auto;
        }
        .event-log p { padding: 5px 0; border-bottom: 1px solid #222; }
        .event-log .timestamp { color: #4ecdc4; }

        .btn {
            background: #4ecdc4;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading { text-align: center; padding: 50px; color: #888; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8em; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗂️ <span>Zently</span> Journal</h1>
            <p class="subtitle" id="project-name">Chargement...</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="stat-percentage">-</div>
                <div class="label">Progression</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-completed">-</div>
                <div class="label">Terminées</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-progress">-</div>
                <div class="label">En cours</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-total">-</div>
                <div class="label">Total</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar" style="width: 0%">0%</div>
        </div>

        <div class="section">
            <h2>📋 Tâches</h2>
            <ul class="task-list" id="task-list">
                <li class="loading">Chargement des tâches...</li>
            </ul>
        </div>

        <div class="section">
            <h2>📅 Session Active</h2>
            <div id="session-container">
                <p class="loading">Chargement...</p>
            </div>
        </div>

        <div class="section">
            <h2>📜 Événements Récents</h2>
            <div class="event-log" id="event-log">
                <p class="loading">Chargement...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderDashboard(data);
            } catch (e) {
                console.error('Erreur:', e);
                document.getElementById('project-name').textContent = 'Erreur de chargement';
            }
        }

        function renderDashboard(data) {
            // Project
            document.getElementById('project-name').textContent = data.project?.name || 'Projet Zently';

            // Stats
            const stats = data.stats || {};
            document.getElementById('stat-percentage').textContent = stats.percentage + '%';
            document.getElementById('stat-completed').textContent = stats.completed;
            document.getElementById('stat-progress').textContent = stats.in_progress;
            document.getElementById('stat-total').textContent = stats.total;

            // Progress bar
            const bar = document.getElementById('progress-bar');
            bar.style.width = stats.percentage + '%';
            bar.textContent = stats.percentage + '%';

            // Tasks
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            (data.tasks || []).forEach(task => {
                const statusClass = task.status === 'Terminé' ? 'completed' :
                                   task.status === 'En cours' ? 'in-progress' : 'not-started';
                const statusIcon = task.status === 'Terminé' ? '✅' :
                                  task.status === 'En cours' ? '🔶' : '⬜';
                taskList.innerHTML += `
                    <li class="task-item ${statusClass}">
                        <div class="task-info">
                            <div class="task-title">${statusIcon} [${task.id}] ${task.title}</div>
                            <div class="task-meta">${task.description || ''}</div>
                        </div>
                        <span class="status-badge ${statusClass}">${task.status}</span>
                    </li>
                `;
            });

            // Sessions
            const sessionContainer = document.getElementById('session-container');
            const activeSession = (data.sessions || []).find(s => !s.ended_at);
            if (activeSession) {
                sessionContainer.innerHTML = `
                    <div class="session-card session-active">
                        <strong>🔄 Session #${activeSession.id}</strong><br>
                        Démarrée: ${activeSession.started_at.slice(0, 16).replace('T', ' ')}
                    </div>
                `;
            } else {
                sessionContainer.innerHTML = '<p style="color:#888">Aucune session active</p>';
            }

            // Events
            const eventLog = document.getElementById('event-log');
            eventLog.innerHTML = '';
            (data.recent_events || []).reverse().forEach(event => {
                eventLog.innerHTML += `
                    <p><span class="timestamp">[${event.timestamp.slice(0, 19).replace('T', ' ')}]</span> ${event.message}</p>
                `;
            });
        }

        // Load on start
        loadData();
        // Refresh every 30s
        setInterval(loadData, 30000);
    </script>
</body>
</html>
