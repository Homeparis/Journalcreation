<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zently Journal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        header h1 { font-size: 2.2em; }
        header h1 span { color: #4ecdc4; }
        .subtitle { color: #888; margin-top: 8px; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #333;
        }
        .stat-card .number { font-size: 2em; font-weight: bold; color: #4ecdc4; }
        .stat-card .label { color: #888; margin-top: 5px; font-size: 0.9em; }

        .progress-container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            height: 25px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .tab.active { background: #4ecdc4; color: #000; }

        .panel { display: none; }
        .panel.active { display: block; }

        .task-item {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .task-item:hover { background: rgba(255,255,255,0.1); }
        .task-item.completed { border-left-color: #4ecdc4; opacity: 0.7; }
        .task-item.in-progress { border-left-color: #f39c12; }

        .task-header { display: flex; justify-content: space-between; align-items: center; }
        .task-title { font-weight: bold; }
        .task-desc { color: #888; font-size: 0.85em; margin-top: 5px; }

        .status-select {
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .notes-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; display: none; }
        .task-item.expanded .notes-section { display: block; }
        .note-item { background: #111; padding: 8px; border-radius: 5px; margin: 5px 0; font-size: 0.85em; }
        .note-time { color: #4ecdc4; }

        .add-note { display: flex; gap: 10px; margin-top: 10px; }
        .add-note input {
            flex: 1;
            background: #222;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 5px;
            color: #fff;
        }

        .btn {
            background: #4ecdc4;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #444; color: #fff; }

        .session-card {
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid #4ecdc4;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .session-active { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .event-log {
            background: #111;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.8em;
            max-height: 400px;
            overflow-y: auto;
        }
        .event-log p { padding: 5px 0; border-bottom: 1px solid #222; }
        .event-log .ts { color: #4ecdc4; }

        .export-btn { margin-top: 20px; }

        @media (max-width: 600px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .tabs { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗂️ <span>Zently</span> Journal</h1>
            <p class="subtitle" id="project-name">Journal de bord du projet</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="stat-pct">0%</div>
                <div class="label">Progression</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-done">0</div>
                <div class="label">Terminées</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-wip">0</div>
                <div class="label">En cours</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-total">0</div>
                <div class="label">Total</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">0%</div>
        </div>

        <div class="tabs">
            <button class="tab active" data-panel="tasks">📋 Tâches</button>
            <button class="tab" data-panel="sessions">📅 Sessions</button>
            <button class="tab" data-panel="events">📜 Événements</button>
            <button class="tab" data-panel="export">📤 Export</button>
        </div>

        <div id="tasks" class="panel active"></div>
        <div id="sessions" class="panel"></div>
        <div id="events" class="panel"></div>
        <div id="export" class="panel">
            <h3>Exporter le journal</h3>
            <p style="color:#888;margin:15px 0;">Téléchargez le journal complet en format Markdown pour Google Drive.</p>
            <button class="btn" onclick="downloadExport()">📥 Télécharger Markdown</button>
            <button class="btn btn-secondary" onclick="resetData()" style="margin-left:10px;">🔄 Réinitialiser</button>
        </div>
    </div>

    <script>
        // Données initiales
        const INITIAL_DATA = {"project":{"name":"Zently.fr","description":"Hub intelligent pour propriétaires immobiliers","created_at":"2026-01-30T11:41:45.040100","onboarding_complete":true},"tasks":[{"id":1,"title":"Architecture & Infrastructure","description":"Setup technique : stack, hébergement, base de données","status":"En cours","notes":[]},{"id":2,"title":"Système d'authentification","description":"Inscription, connexion, gestion des comptes","status":"Non commencé","notes":[]},{"id":3,"title":"Dashboard Hub Central","description":"Interface principale : vue globale des biens","status":"Non commencé","notes":[]},{"id":4,"title":"Module Guard - Base","description":"Structure du module surveillance et alertes","status":"Non commencé","notes":[]},{"id":5,"title":"Guard - Détection anomalies","description":"Algorithmes de détection : revenus, activité","status":"Non commencé","notes":[]},{"id":6,"title":"Guard - Système d'alertes","description":"Notifications, emails, historique","status":"Non commencé","notes":[]},{"id":7,"title":"Module Radar - Base","description":"Structure du module veille et comparaisons","status":"Non commencé","notes":[]},{"id":8,"title":"Radar - Positionnement marché","description":"Comparaison biens similaires, tendances","status":"Non commencé","notes":[]},{"id":9,"title":"Radar - Signaux de décrochage","description":"Détection baisse de performance","status":"Non commencé","notes":[]},{"id":10,"title":"Module CleanSync - Base","description":"Structure coordination prestations","status":"Non commencé","notes":[]},{"id":11,"title":"CleanSync - Planning & Suivi","description":"Calendrier ménages, validation passages","status":"Non commencé","notes":[]},{"id":12,"title":"CleanSync - Gestion prestataires","description":"Carnet d'adresses, historique, évaluations","status":"Non commencé","notes":[]},{"id":13,"title":"Module Pulse - Conception","description":"Design du module financier simplifié","status":"Non commencé","notes":[]},{"id":14,"title":"Pulse - Revenus & Charges","description":"Suivi cash-flow, charges fixes","status":"Non commencé","notes":[]},{"id":15,"title":"API & Intégrations externes","description":"Connexions Airbnb, Booking, PMS","status":"Non commencé","notes":[]},{"id":16,"title":"Design UI/UX","description":"Maquettes, design system, responsive","status":"Non commencé","notes":[]},{"id":17,"title":"Tests & Qualité","description":"Tests unitaires, intégration, UAT","status":"Non commencé","notes":[]},{"id":18,"title":"Déploiement & Lancement","description":"Mise en production, monitoring","status":"Non commencé","notes":[]}],"events":[{"timestamp":"2026-01-30T11:41:45","type":"setup","message":"Projet Zently.fr initialisé"},{"timestamp":"2026-01-30T11:45:14","type":"status_change","message":"Tâche #1: Non commencé → En cours"},{"timestamp":"2026-01-30T11:45:14","type":"session_start","message":"Session #1 démarrée"}],"sessions":[{"id":1,"started_at":"2026-01-30T11:45:14","ended_at":null,"report":null}]};

        // Storage
        const STORAGE_KEY = 'zently_journal';

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : INITIAL_DATA;
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function logEvent(data, message, type = 'info') {
            data.events.push({
                timestamp: new Date().toISOString().slice(0, 19),
                type: type,
                message: message
            });
        }

        // Render
        function render() {
            const data = loadData();
            const tasks = data.tasks || [];

            // Stats
            const total = tasks.length;
            const done = tasks.filter(t => t.status === 'Terminé').length;
            const wip = tasks.filter(t => t.status === 'En cours').length;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('stat-pct').textContent = pct + '%';
            document.getElementById('stat-done').textContent = done;
            document.getElementById('stat-wip').textContent = wip;
            document.getElementById('stat-total').textContent = total;
            document.getElementById('project-name').textContent = data.project?.name || 'Projet Zently';

            const bar = document.getElementById('progress-bar');
            bar.style.width = pct + '%';
            bar.textContent = pct + '%';

            // Tasks
            const tasksHtml = tasks.map(t => {
                const cls = t.status === 'Terminé' ? 'completed' : t.status === 'En cours' ? 'in-progress' : '';
                const icon = t.status === 'Terminé' ? '✅' : t.status === 'En cours' ? '🔶' : '⬜';
                const notesHtml = (t.notes || []).map(n =>
                    `<div class="note-item"><span class="note-time">[${n.timestamp?.slice(0,10) || ''}]</span> ${n.content}</div>`
                ).join('');

                return `
                    <div class="task-item ${cls}" data-id="${t.id}">
                        <div class="task-header" onclick="toggleTask(${t.id})">
                            <span class="task-title">${icon} [${t.id}] ${t.title}</span>
                            <select class="status-select" onchange="updateStatus(${t.id}, this.value)" onclick="event.stopPropagation()">
                                <option ${t.status === 'Non commencé' ? 'selected' : ''}>Non commencé</option>
                                <option ${t.status === 'En cours' ? 'selected' : ''}>En cours</option>
                                <option ${t.status === 'Terminé' ? 'selected' : ''}>Terminé</option>
                            </select>
                        </div>
                        <div class="task-desc">${t.description || ''}</div>
                        <div class="notes-section">
                            <strong>Notes:</strong>
                            ${notesHtml || '<p style="color:#666">Aucune note</p>'}
                            <div class="add-note">
                                <input type="text" id="note-${t.id}" placeholder="Ajouter une note...">
                                <button class="btn" onclick="addNote(${t.id})">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('tasks').innerHTML = tasksHtml;

            // Sessions
            const sessions = data.sessions || [];
            const activeSession = sessions.find(s => !s.ended_at);
            let sessionsHtml = '';

            if (activeSession) {
                sessionsHtml += `
                    <div class="session-card session-active">
                        <strong>🔄 Session #${activeSession.id} en cours</strong><br>
                        <small>Démarrée: ${activeSession.started_at?.slice(0,16).replace('T',' ')}</small>
                        <div style="margin-top:10px">
                            <input type="text" id="session-report" placeholder="Compte-rendu de fin de session..." style="width:100%;padding:8px;background:#222;border:1px solid #444;color:#fff;border-radius:5px;margin-bottom:10px;">
                            <button class="btn" onclick="endSession()">Terminer la session</button>
                        </div>
                    </div>
                `;
            } else {
                sessionsHtml += `<button class="btn" onclick="startSession()">🚀 Démarrer une session</button>`;
            }

            sessionsHtml += '<h4 style="margin:20px 0 10px">Historique</h4>';
            sessions.slice().reverse().forEach(s => {
                const status = s.ended_at ? '✅' : '🔄';
                sessionsHtml += `
                    <div class="session-card" style="opacity:${s.ended_at ? 0.7 : 1}">
                        ${status} <strong>Session #${s.id}</strong><br>
                        <small>${s.started_at?.slice(0,16).replace('T',' ')} → ${s.ended_at?.slice(0,16).replace('T',' ') || 'En cours'}</small>
                        ${s.report ? `<p style="margin-top:8px;color:#888">${s.report}</p>` : ''}
                    </div>
                `;
            });
            document.getElementById('sessions').innerHTML = sessionsHtml;

            // Events
            const eventsHtml = (data.events || []).slice().reverse().slice(0, 50).map(e =>
                `<p><span class="ts">[${e.timestamp?.slice(0,19).replace('T',' ')}]</span> ${e.message}</p>`
            ).join('');
            document.getElementById('events').innerHTML = `<div class="event-log">${eventsHtml}</div>`;
        }

        // Actions
        function toggleTask(id) {
            const el = document.querySelector(`.task-item[data-id="${id}"]`);
            el.classList.toggle('expanded');
        }

        function updateStatus(id, status) {
            const data = loadData();
            const task = data.tasks.find(t => t.id === id);
            if (task && task.status !== status) {
                logEvent(data, `Tâche #${id} "${task.title}": ${task.status} → ${status}`, 'status_change');
                task.status = status;
                saveData(data);
                render();
            }
        }

        function addNote(id) {
            const input = document.getElementById(`note-${id}`);
            const content = input.value.trim();
            if (!content) return;

            const data = loadData();
            const task = data.tasks.find(t => t.id === id);
            if (task) {
                task.notes = task.notes || [];
                task.notes.push({ timestamp: new Date().toISOString(), content: content });
                logEvent(data, `Note ajoutée à tâche #${id}`, 'note_added');
                saveData(data);
                render();
                // Garder la tâche ouverte
                setTimeout(() => toggleTask(id), 10);
            }
        }

        function startSession() {
            const data = loadData();
            const id = (data.sessions?.length || 0) + 1;
            data.sessions.push({ id: id, started_at: new Date().toISOString(), ended_at: null, report: null });
            logEvent(data, `Session #${id} démarrée`, 'session_start');
            saveData(data);
            render();
        }

        function endSession() {
            const data = loadData();
            const session = data.sessions.find(s => !s.ended_at);
            if (session) {
                session.ended_at = new Date().toISOString();
                session.report = document.getElementById('session-report')?.value || '';
                logEvent(data, `Session #${session.id} terminée`, 'session_end');
                saveData(data);
                render();
            }
        }

        function downloadExport() {
            const data = loadData();
            const tasks = data.tasks || [];
            const done = tasks.filter(t => t.status === 'Terminé').length;
            const pct = tasks.length > 0 ? Math.round((done / tasks.length) * 100) : 0;

            let md = `# Journal de Bord - ${data.project?.name || 'Zently'}\n\n`;
            md += `**Progression:** ${pct}% (${done}/${tasks.length} tâches)\n\n`;
            md += `## Tâches\n\n`;

            tasks.forEach(t => {
                const icon = t.status === 'Terminé' ? '✅' : t.status === 'En cours' ? '🔶' : '⬜';
                md += `### ${icon} [${t.id}] ${t.title}\n`;
                md += `- **Statut:** ${t.status}\n`;
                md += `- **Description:** ${t.description || 'N/A'}\n`;
                if (t.notes?.length) {
                    md += `- **Notes:**\n`;
                    t.notes.forEach(n => md += `  - [${n.timestamp?.slice(0,10)}] ${n.content}\n`);
                }
                md += '\n';
            });

            md += `## Sessions\n\n`;
            (data.sessions || []).forEach(s => {
                md += `- Session #${s.id}: ${s.started_at?.slice(0,10)} ${s.report ? '- ' + s.report : ''}\n`;
            });

            const blob = new Blob([md], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `zently_journal_${new Date().toISOString().slice(0,10)}.md`;
            a.click();
        }

        function resetData() {
            if (confirm('Réinitialiser toutes les données ?')) {
                localStorage.removeItem(STORAGE_KEY);
                render();
            }
        }

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.panel).classList.add('active');
            });
        });

        // Init
        render();
    </script>
</body>
</html>
